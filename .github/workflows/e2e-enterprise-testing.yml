name: Enterprise QA E2E & Vulnerability Test Pipeline (1,200 Tests)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  enterprise-qa-matrix:
    name: Run Enterprise E2E Test Suite (1,200 Test Cases)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Server Dependencies
        run: |
          cd server
          npm install

      - name: 4. Install Client Dependencies & Typecheck
        run: |
          cd client
          npm install
          npm run typecheck
